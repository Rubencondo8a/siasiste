<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIASISTE - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/appAdmin.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-bottom);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin: 1rem;
    }
    .login-header {
      background: #0f172a;
      color: white;
      border-radius: 16px 16px 0 0;
      padding: 30px;
      text-align: center;
    }
    .login-header i {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #3b82f6;
    }
    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 0.2rem rgba(59,130,246,0.25);
    }
    .btn-login {
      background: #3b82f6;
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 8px;
      transition: 0.3s;
    }
    .btn-login:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    .input-group-text {
      background: #f1f5f9;
      border-right: none;
    }
    .input-group .form-control {
      border-left: none;
    }
    .input-group .form-control:focus {
      border-left: none;
    }

    @media (max-width: 480px) {
      .login-header {
        padding: 20px;
      }
      .login-header i {
        font-size: 2.2rem;
      }
      .login-header h4 {
        font-size: 1.2rem;
      }
      .card-body.p-4 {
        padding: 1.25rem !important;
      }
      .login-card {
        margin: 0.5rem;
        border-radius: 12px;
      }
      .login-header {
        border-radius: 12px 12px 0 0;
      }
    }

    @media (max-width: 375px) {
      .login-header {
        padding: 15px;
      }
      .login-header i {
        font-size: 1.8rem;
      }
      .login-header h4 {
        font-size: 1rem;
      }
      .form-control, .form-select {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="card login-card">
    <div class="login-header">
      <i class="bi bi-fingerprint"></i>
      <h4 class="mb-0">SIASISTE</h4>
      <small class="text-secondary">Sistema de Asistencia</small>
    </div>
    <div class="card-body p-4">
      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="mb-3">
          <label class="form-label fw-semibold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="loginUser" placeholder="Ingrese su usuario" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="loginPass" placeholder="Ingrese su contraseña" required>
            <button class="btn btn-outline-secondary" type="button" onclick="togglePass()">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Recordarme</label>
        </div>
        <button type="submit" class="btn btn-login btn-primary w-100 text-white">
          <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
        </button>
      </form>
      <div class="text-center mt-3">
        <small class="text-muted">Usuario predeterminado: <strong>admin</strong> / <strong>admin123</strong></small>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/auth.js"></script>
  <script>
    if (isLoggedIn()) {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
